<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>DespensApp - Nuevo producto</title>
<!-- Tailwind CSS v3 with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-layout">
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Hide scrollbar for clean UI */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-slate-100 flex justify-center min-h-screen text-slate-800 antialiased selection:bg-blue-100">
<!-- BEGIN: Mobile Device Frame Wrapper (390px default layout) -->
<div class="w-full max-w-[420px] bg-slate-50 min-h-screen flex flex-col shadow-2xl relative pb-28 border-x border-slate-200/60">
<!-- BEGIN: Top Bar / Header -->
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200/80 px-4 py-3.5 flex items-center justify-between">
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-sm shadow-blue-500/30">
<span class="material-symbols-outlined text-[20px]">inventory_2</span>
</div>
<span class="font-bold text-lg text-slate-900 tracking-tight">DespensApp</span>
</div>
<div class="flex items-center gap-1">
<button class="w-9 h-9 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-100 transition-colors relative" type="button">
<span class="material-symbols-outlined text-[22px]">notifications</span>
<span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-blue-600 ring-2 ring-white"></span>
</button>
</div>
</header>
<!-- END: Top Bar / Header -->
<!-- BEGIN: Main Scrollable Content -->
<main class="flex-1 px-4 pt-4 pb-8 space-y-4">
<!-- Title Section with back button -->
<div class="flex items-center gap-2 pt-1 pb-1">
<button class="p-1 -ml-1 text-slate-500 hover:text-slate-800 rounded-lg" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-2xl font-bold text-slate-900 tracking-tight">Nuevo producto</h1>
</div>
<!-- Form Container Card -->
<form class="bg-white rounded-2xl border border-slate-200/80 shadow-xs p-4 sm:p-5 space-y-4">
<!-- Campo 1: Familia -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-slate-700">
          Familia <span class="text-rose-500">*</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-[20px] pointer-events-none">search</span>
<input class="w-full pl-10 pr-10 py-2.5 bg-slate-50 hover:bg-slate-100/70 cursor-pointer border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors" placeholder="Buscar familia..." readonly="" type="text">
<span class="material-symbols-outlined absolute right-3 text-slate-400 text-[20px] pointer-events-none">expand_more</span>
</div>
</div><div class="space-y-1.5">
<label class="block text-xs font-semibold text-slate-700">
          Nombre <span class="text-rose-500">*</span>
</label>
<input class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors" placeholder="Ej. Leche Deslactosada Light" type="text">
</div>
<!-- Campo 2: Marca -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-slate-700">
          Marca
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-[20px] pointer-events-none">search</span>
<input class="w-full pl-10 pr-10 py-2.5 bg-slate-50 hover:bg-slate-100/70 cursor-pointer border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors" placeholder="Buscar marca..." readonly="" type="text">
<span class="material-symbols-outlined absolute right-3 text-slate-400 text-[20px] pointer-events-none">expand_more</span>
</div>
</div><div class="space-y-1.5">
<label class="block text-xs font-semibold text-slate-700">
          Modelo
        </label>
<input class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors" placeholder="Ej. Tetra Pak 1L" type="text">
</div>
<!-- Campo 3: Descripción -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-slate-700">
          Descripción <span class="text-rose-500">*</span>
</label>
<input class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors" placeholder="Ej. Leche entera ultrapasteurizada" type="text">
</div>
<!-- Fila doble: Contenido y Unidad de Medida -->
<div class="grid grid-cols-2 gap-3">
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-slate-700">
            Contenido
          </label>
<input class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors" placeholder="1" type="number" value="1">
</div>
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-slate-700">
            Unidad de medida
          </label>
<div class="relative flex items-center">
<input class="w-full pl-3 pr-8 py-2.5 bg-slate-50 hover:bg-slate-100/70 cursor-pointer border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors truncate" readonly="" type="text" value="Litro (L)">
<span class="material-symbols-outlined absolute right-2.5 text-slate-400 text-[18px] pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- BEGIN: Card de Ubicación (Exactamente según la referencia visual IMAGE_1) -->
<div class="rounded-2xl border border-slate-200/80 bg-slate-50/50 p-3.5 sm:p-4 space-y-2.5" data-purpose="location-card">
<label class="text-[11px] font-bold tracking-wider text-slate-700 uppercase block">
          UBICACIÓN EN DESPENSA / REFRI
        </label>
<button class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white hover:border-blue-300 shadow-2xs transition-all text-left group" type="button">
<div class="flex items-center gap-2.5 truncate">
<div class="w-6 h-6 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 flex-shrink-0">
<span class="material-symbols-outlined text-[17px]">location_on</span>
</div>
<span class="text-sm font-semibold text-slate-800 group-hover:text-blue-600 transition-colors">Refrigerador Cocina</span>
</div>
<span class="material-symbols-outlined text-slate-400 text-[18px]">chevron_right</span>
</button>
</div>
<!-- END: Card de Ubicación -->
<!-- Propiedades personalizadas -->
<div class="pt-1">
<label class="block text-xs font-semibold text-slate-700 mb-2">
          Propiedades personalizadas
        </label>
<button class="w-full py-2.5 px-4 rounded-xl border border-blue-200/80 bg-blue-50/60 hover:bg-blue-100/70 text-blue-600 font-semibold text-sm flex items-center justify-center gap-1.5 transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">add</span>
<span class="">Agregar propiedad</span>
</button>
</div>
<!-- Sección Visual del Producto -->
<div class="space-y-3 pt-2">
<label class="block text-xs font-semibold text-slate-700">
          Visual del producto
        </label>
<!-- Segmented Control (Imagen vs Ícono) -->
<div class="grid grid-cols-2 p-1 bg-slate-100 rounded-xl border border-slate-200/60 text-xs font-semibold text-slate-600">
<button class="py-1.5 rounded-lg bg-white text-slate-900 shadow-xs flex items-center justify-center gap-1.5" type="button">
<span class="material-symbols-outlined text-[16px] text-blue-600">image</span>
<span class="">Imagen</span>
</button>
<button class="py-1.5 rounded-lg text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5" type="button">
<span class="material-symbols-outlined text-[16px]">interests</span>
<span class="">Ícono</span>
</button>
</div>
<!-- Dropzone de Imagen -->
<div class="border-2 border-dashed border-slate-300 hover:border-blue-400 bg-slate-50/60 hover:bg-blue-50/30 rounded-2xl p-5 flex flex-col items-center justify-center text-center cursor-pointer transition-colors group">
<div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mb-2.5 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[24px]">add_photo_alternate</span>
</div>
<span class="text-sm font-semibold text-slate-800 mb-0.5">Toca para agregar imagen</span>
<span class="text-xs text-slate-400">Formatos PNG, JPG hasta 5MB</span>
<input accept="image/*" class="hidden" type="file">
</div>
</div>
<!-- Botones de Acción -->
<div class="pt-4 space-y-2">
<button class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm rounded-xl shadow-sm shadow-blue-500/25 transition-colors flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-[19px]">save</span>
<span class="">Guardar producto</span>
</button>
<button class="w-full py-2.5 px-4 bg-transparent hover:bg-slate-100 text-slate-600 font-semibold text-sm rounded-xl border border-slate-200 transition-colors" type="button">
          Cancelar
        </button>
</div>
</form>
</main>
<!-- END: Main Scrollable Content -->
<!-- BEGIN: Bottom Navigation Bar (5 tabs) -->
<nav class="fixed bottom-0 left-0 right-0 max-w-[420px] mx-auto bg-white/95 backdrop-blur-md border-t border-slate-200/90 px-2 py-2 flex items-center justify-around z-40">
<!-- Tab 1: Inicio -->
<a class="flex flex-col items-center justify-center py-1 px-2.5 rounded-lg text-slate-400 hover:text-slate-600" href="#">
<span class="material-symbols-outlined text-[22px]">home</span>
<span class="text-[10px] font-medium mt-0.5">Inicio</span>
</a>
<!-- Tab 2: Despensa (Activo) -->
<a class="flex flex-col items-center justify-center py-1 px-2.5 rounded-lg text-blue-600" href="#">
<span class="material-symbols-outlined fill-1 text-[22px]">kitchen</span>
<span class="text-[10px] font-bold mt-0.5">Despensa</span>
</a>
<!-- Tab 3: Carritos -->
<a class="flex flex-col items-center justify-center py-1 px-2.5 rounded-lg text-slate-400 hover:text-slate-600" href="#">
<span class="material-symbols-outlined text-[22px]">shopping_cart</span>
<span class="text-[10px] font-medium mt-0.5">Carritos</span>
</a>
<!-- Tab 4: Listas -->
<a class="flex flex-col items-center justify-center py-1 px-2.5 rounded-lg text-slate-400 hover:text-slate-600" href="#">
<span class="material-symbols-outlined text-[22px]">checklist</span>
<span class="text-[10px] font-medium mt-0.5">Listas</span>
</a>
<!-- Tab 5: Proveedores -->
<a class="flex flex-col items-center justify-center py-1 px-2.5 rounded-lg text-slate-400 hover:text-slate-600" href="#">
<span class="material-symbols-outlined text-[22px]">storefront</span>
<span class="text-[10px] font-medium mt-0.5">Proveedores</span>
</a>
</nav>
<!-- END: Bottom Navigation Bar -->
</div>
<!-- END: Mobile Device Frame Wrapper -->


</body></html>
