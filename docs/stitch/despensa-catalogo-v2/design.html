<!DOCTYPE html><html lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>DespensApp - Productos</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#EFF6FF',
              100: '#DBEAFE',
              500: '#3B82F6',
              600: '#2563EB',
              700: '#1D4ED8',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-enhancements">
    /* Subtle pulse animation for decorative empty state glow */
    @keyframes subtle-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-subtle-float {
      animation: subtle-float 3.5s ease-in-out infinite;
    }
    /* Safe area padding for mobile navigation */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-blue-100 selection:text-blue-700">
<!-- BEGIN: MainHeader -->
<!-- Top App Bar following iOS/Material clean design pattern -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-100 transition-colors" data-purpose="app-header">
<div class="max-w-md mx-auto px-5 h-16 flex items-center justify-between">
<!-- Brand identity with stylized pantry box icon -->
<div class="flex items-center space-x-2.5">
<div aria-hidden="true" class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xl font-bold tracking-tight text-blue-600">DespensApp</span>
</div>
<!-- Action buttons in header -->
<div class="flex items-center space-x-2">
<button aria-label="Notificaciones" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200/80 flex items-center justify-center text-slate-600 transition-colors" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 max-w-md mx-auto w-full px-5 pt-6 pb-28" data-purpose="products-content">
<!-- Title and quick summary badge -->
<div class="flex items-start justify-between mb-4">
<div>
<h1 class="text-2xl font-extrabold tracking-tight text-slate-900 leading-tight">Despensa</h1>
<p class="text-xs font-medium text-slate-400 mt-0.5">Control de despensa e inventario</p>
</div>
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200/60">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        0 Artículos
      </span>
</div>
<!-- Category filter chips (idle/contextual preview) -->
<div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-3 mb-4 -mx-1 px-1" data-purpose="category-filters">
<button class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white shadow-sm shadow-blue-500/20 whitespace-nowrap">
        Todos
      </button>
<button class="px-3.5 py-1.5 rounded-full text-xs font-medium bg-white text-slate-500 border border-slate-200/70 hover:border-slate-300 whitespace-nowrap">
        Despensa
      </button>
<button class="px-3.5 py-1.5 rounded-full text-xs font-medium bg-white text-slate-500 border border-slate-200/70 hover:border-slate-300 whitespace-nowrap">
        Nevera
      </button>
<button class="px-3.5 py-1.5 rounded-full text-xs font-medium bg-white text-slate-500 border border-slate-200/70 hover:border-slate-300 whitespace-nowrap">
        Limpieza
      </button>
</div>
<!-- BEGIN: EmptyStateCard -->
<!-- Polished, production-ready empty state container -->
<section class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 sm:p-8 flex flex-col items-center text-center mt-2 relative overflow-hidden" data-purpose="empty-state-card">
<!-- Subtle background ambient decor -->
<div class="absolute -top-12 -right-12 w-36 h-36 bg-blue-50 rounded-full blur-2xl opacity-60 pointer-events-none"></div>
<div class="absolute -bottom-12 -left-12 w-36 h-36 bg-indigo-50 rounded-full blur-2xl opacity-60 pointer-events-none"></div>
<!-- Linear & modern vector illustration of pantry goods -->

<!-- State Title & Verbatim Description -->
<h2 class="text-lg font-bold text-slate-800 mb-2">Tu despensa está vacía</h2>
<p class="text-sm text-slate-500 font-normal leading-relaxed max-w-xs mx-auto mb-6">
        Sin productos todavía. Toca el botón + para agregar el primero.
      </p>
<!-- Quick Action Prompt Button -->
<button class="w-full py-3 px-4 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-xl font-semibold text-sm transition-all duration-150 flex items-center justify-center gap-2 active:scale-[0.98]" type="button"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="">Comprar carrito</span></button>
</section>
<!-- END: EmptyStateCard -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: FloatingActionButton -->
<!-- Prominent Primary Action Button positioned right above the bottom bar -->

<!-- END: FloatingActionButton -->
<!-- BEGIN: BottomNavigation -->
<!-- Fixed modern tab bar with exact required labels and icons -->
<nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-lg border-t border-slate-200/80 pb-safe" data-purpose="bottom-navigation">
<div class="max-w-md mx-auto px-2 py-1.5 flex justify-around items-center">
<!-- Tab 1: Inicio -->
<a class="flex flex-col items-center py-1 px-2.5 text-slate-400 hover:text-slate-600 transition-colors group" href="#">
<div class="w-10 h-7 flex items-center justify-center">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium tracking-tight mt-0.5">Inicio</span>
</a>
<!-- Tab 2: Productos (Active State with soft pill) -->
<a class="flex flex-col items-center py-1 px-2.5 text-blue-600 font-semibold transition-all" href="#">
<div class="w-12 h-7 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 shadow-sm">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] tracking-tight mt-0.5">Despensa</span>
</a>
<!-- Tab 3: Carritos -->
<a class="flex flex-col items-center py-1 px-2.5 text-slate-400 hover:text-slate-600 transition-colors group" href="#">
<div class="w-10 h-7 flex items-center justify-center">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium tracking-tight mt-0.5">Carritos</span>
</a>
<!-- Tab 4: Listas -->
<a class="flex flex-col items-center py-1 px-2.5 text-slate-400 hover:text-slate-600 transition-colors group" href="#">
<div class="w-10 h-7 flex items-center justify-center">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium tracking-tight mt-0.5">Listas</span>
</a>
<!-- Tab 5: Proveedores -->
<a class="flex flex-col items-center py-1 px-2.5 text-slate-400 hover:text-slate-600 transition-colors group" href="#">
<div class="w-10 h-7 flex items-center justify-center">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium tracking-tight mt-0.5">Proveedores</span>
</a>
</div>
</nav>
<!-- END: BottomNavigation -->


</body></html>
